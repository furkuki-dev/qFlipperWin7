name: Build qFlipper Windows x86

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_windows_x86:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0   # needed for git describe (version in NSIS and qmake)
          fetch-tags: true # without tags git describe fails and NSIS gets an empty version

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt 5.15.2 (MSVC 2019, 32-bit) via aqtinstall
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "aqtinstall==3.1.*"

          # Ask aqt which modules it actually offers for this kit and print them to the log
          $listOutput = & python -m aqt list-qt windows desktop --modules 5.15.2 win32_msvc2019 2>&1 |
            ForEach-Object { "$_" }
          Write-Host "=== Modules offered by aqt for 5.15.2 win32_msvc2019 ==="
          $listOutput | ForEach-Object { Write-Host $_ }

          # Module names that qFlipper needs (qtquickcontrols2 is the qmake name for quickcontrols2)
          $wanted = @('qtdeclarative', 'qtquickcontrols2', 'qtsvg', 'qtserialport')
          $offered = @($listOutput | ForEach-Object { $_ -split '\s+' } | Where-Object { $_ -match '^qt[a-z0-9]+$' })
          $modules = @($wanted | Where-Object { $offered -contains $_ })
          $missing = @($wanted | Where-Object { $offered -notcontains $_ })

          Write-Host "Installing modules: $($modules -join ', ')"
          if ($missing.Count -gt 0) {
            Write-Host "::warning::Not found in aqt module list: $($missing -join ', ')"
          }

          $installArgs = @('install-qt', '--outputdir', 'C:\Qt', 'windows', 'desktop', '5.15.2', 'win32_msvc2019')
          if ($modules.Count -gt 0) { $installArgs += @('-m') + $modules }
          & python -m aqt @installArgs
          if ($LASTEXITCODE -ne 0) { throw "aqt install-qt failed with exit code $LASTEXITCODE" }

          if (-not (Test-Path 'C:\Qt\5.15.2\msvc2019\bin\qmake.exe')) {
            throw 'qmake.exe not found after aqt install'
          }

      - name: Install Visual Studio 2019 Build Tools (x86 toolchain)
        shell: pwsh
        run: |
          # build_windows.bat searches only for VS 2019 Community/Professional/Enterprise,
          # so install Build Tools and expose them under the "Enterprise" path via a junction.
          choco install visualstudio2019buildtools -y --no-progress `
            --package-parameters "--add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --includeRecommended"
          $vsRoot = 'C:\Program Files (x86)\Microsoft Visual Studio\2019'
          if (-not (Test-Path "$vsRoot\Enterprise")) {
            New-Item -ItemType Junction -Path "$vsRoot\Enterprise" -Target "$vsRoot\BuildTools" | Out-Null
          }
          if (-not (Test-Path "$vsRoot\Enterprise\VC\Auxiliary\Build\vcvars32.bat")) {
            throw 'vcvars32.bat not found after VS 2019 Build Tools install'
          }

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) {
            choco install nsis -y --no-progress
          }

      - name: Install jom
        shell: pwsh
        run: |
          $jomDir = 'C:\Qt\Tools\QtCreator\bin\jom'
          New-Item -ItemType Directory -Force -Path $jomDir | Out-Null
          Invoke-WebRequest -Uri 'https://download.qt.io/official_releases/jom/jom.zip' -OutFile "$env:RUNNER_TEMP\jom.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\jom.zip" -DestinationPath $jomDir -Force
          if (-not (Test-Path "$jomDir\jom.exe")) { throw 'jom.exe not found' }

      - name: Install OpenSSL 1.1.1 (Win32) for Qt runtime
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\Win32OpenSSL.exe"
          Invoke-WebRequest -Uri 'https://slproweb.com/download/Win32OpenSSL-1_1_1w.exe' -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SP-','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\OpenSSL-Win32' -Wait
          $dst = 'C:\Qt\Tools\OpenSSL\Win_x86\bin'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Get-ChildItem 'C:\OpenSSL-Win32' -Recurse -Include 'libssl-1_1.dll','libcrypto-1_1.dll' |
            Copy-Item -Destination $dst -Force
          if (-not (Test-Path "$dst\libssl-1_1.dll")) { throw 'OpenSSL DLLs not found' }

      - name: Download VC++ redistributables (x86)
        shell: pwsh
        run: |
          $dst = 'C:\Qt\vcredist'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Invoke-WebRequest -Uri 'https://aka.ms/vs/16/release/vc_redist.x86.exe' -OutFile "$dst\vcredist_msvc2019_x86.exe"
          Invoke-WebRequest -Uri 'https://download.microsoft.com/download/5/B/C/5BC5DBB3-652D-4DCE-B14A-475AB85EEF6E/vcredist_x86.exe' -OutFile "$dst\vcredist_x86.exe"

      - name: Download STM32 DFU driver
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\stm32.zip"
          $tmp = "$env:RUNNER_TEMP\stm32"
          Invoke-WebRequest -Uri 'https://cdn.flipperzero.one/STM32_DFU_USB_Driver.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $inf = Get-ChildItem $tmp -Recurse -Filter 'STM32Bootloader.inf' | Select-Object -First 1
          if (-not $inf) { throw 'STM32Bootloader.inf not found in archive' }
          Copy-Item (Split-Path $inf.FullName) -Destination 'C:\STM32 Driver' -Recurse -Force

      - name: Fetch nanopb sources
        shell: pwsh
        run: |
          if (-not (Test-Path '3rdparty\nanopb\pb_common.c')) {
            git clone --depth 1 --branch 0.4.9.1 https://github.com/nanopb/nanopb.git "$env:RUNNER_TEMP\nanopb"
            if ($LASTEXITCODE -ne 0) { throw 'git clone of nanopb failed' }
            New-Item -ItemType Directory -Force -Path '3rdparty\nanopb' | Out-Null
            Copy-Item "$env:RUNNER_TEMP\nanopb\*.c" '3rdparty\nanopb\' -Force
            Copy-Item "$env:RUNNER_TEMP\nanopb\pb*.h" '3rdparty\nanopb\' -Force
          }
          foreach ($f in 'pb_common.c','pb_decode.c','pb_encode.c') {
            if (-not (Test-Path "3rdparty\nanopb\$f")) { throw "nanopb file missing: $f" }
          }

      - name: Build qFlipper (x86)
        shell: cmd
        run: build_windows.bat

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qFlipper-windows-x86
          path: |
            build/qFlipperSetup-32bit.exe
            build/qFlipper-32bit.zip
          if-no-files-found: error
          retention-days: 14
